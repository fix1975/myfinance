<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyFinance 1.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding-bottom:90px}header{background:#fff;padding:20px;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}h1{margin:0;font-size:28px}h2{font-size:22px;margin:22px 0 12px}main{max-width:760px;margin:auto;padding:0 16px}section{display:none}.hero{margin-top:16px;background:#172033;color:#fff;border-radius:24px;padding:22px}.hero small{opacity:.7}.big{font-size:38px;font-weight:750;margin:5px 0 18px}.hg,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hs,.stat{background:#ffffff14;border-radius:14px;padding:11px}.hs span,.stat small{display:block;font-size:12px;opacity:.7}.hs b,.stat strong{font-size:19px}.grid{margin-top:12px}.stat{background:#fff;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000008}.muted{color:#687083;font-size:13px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center}.amount{font-weight:700;white-space:nowrap}.actions{display:flex;gap:7px;margin-top:10px}button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:650;background:#172033;color:#fff}button.secondary{background:#eef0f4;color:#172033}.add{width:100%;margin:8px 0 14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 4px;z-index:10}.bottom button{background:none;color:#687083;padding:6px 4px;font-size:12px}.bottom button.active{color:#172033}.empty{text-align:center;color:#687083;padding:20px}.chart{height:190px;border-left:1px solid #ddd;border-bottom:1px solid #ddd}.chart svg{width:100%;height:100%}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;overflow:auto}.box{background:#fff;border-radius:22px;max-width:560px;margin:35px auto;padding:20px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8dce3;border-radius:11px;font-size:16px}textarea{min-height:80px}.ma{display:flex;gap:8px;margin-top:18px}.ma button{flex:1}
</style></head><body><header><h1>MyFinance</h1></header><main>
<section id="dashboard"><div class="hero"><small>NETTOVERMÖGEN</small><div class="big" id="net">0,00 €</div><div class="hg"><div class="hs"><span>Vermögen</span><b id="ha">0,00 €</b></div><div class="hs"><span>Schulden</span><b id="hd">0,00 €</b></div></div></div><div class="grid"><div class="stat"><small>Immobilien-Eigenkapital</small><strong id="pe">0,00 €</strong></div><div class="stat"><small>Liquidität</small><strong id="liq">0,00 €</strong></div></div><h2>Vermögensentwicklung</h2><div class="card" id="chart"></div><div class="card"><div class="item"><div><b>Versicherungen</b><div class="muted">monatlich</div></div><b id="im">0,00 €</b></div><div class="item" style="margin-top:14px"><b>Jahreskosten</b><b id="iy">0,00 €</b></div></div></section>
<section id="assets"><h2>Vermögen</h2><button class="add" onclick="openM('asset')">＋ Vermögenswert hinzufügen</button><div id="al"></div></section>
<section id="properties"><h2>Immobilien</h2><button class="add" onclick="openM('property')">＋ Immobilie hinzufügen</button><div id="pl"></div></section>
<section id="debts"><h2>Schulden & Kredite</h2><button class="add" onclick="openM('debt')">＋ Kredit hinzufügen</button><div id="dl"></div></section>
<section id="insurance"><h2>Versicherungen</h2><button class="add" onclick="openM('insurance')">＋ Versicherung hinzufügen</button><div id="il"></div></section>
</main><nav class="bottom"><button onclick="show('dashboard')" id="n-dashboard">⌂<br>Übersicht</button><button onclick="show('assets')" id="n-assets">€<br>Vermögen</button><button onclick="show('properties')" id="n-properties">⌂<br>Immobilien</button><button onclick="show('debts')" id="n-debts">−<br>Kredite</button><button onclick="show('insurance')" id="n-insurance">✓<br>Versicherung</button></nav>
<div class="modal" id="modal"><div class="box"><h2 id="mt">Hinzufügen</h2><div id="form"></div><div class="ma"><button class="secondary" onclick="closeM()">Abbrechen</button><button onclick="save()">Speichern</button></div></div></div>
<script>
const K='myfinance_v13';let d=JSON.parse(localStorage.getItem(K)||'{"assets":[],"properties":[],"debts":[],"insurances":[],"history":[]}'),t='asset',ei=-1;
const $=id=>document.getElementById(id),euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0),v=id=>$(id)?.value||'',num=id=>parseFloat(v(id))||0;
function show(id){document.querySelectorAll('section').forEach(x=>x.style.display='none');$(id).style.display='block';document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));$('n-'+id)?.classList.add('active')}
function fld(id,l,tp='text',val='',ex=''){return `<label>${l}</label><input id="${id}" type="${tp}" value="${val??''}" ${ex}>`}
function openM(x,i=-1){t=x;ei=i;let key=x==='asset'?'assets':x==='property'?'properties':x==='debt'?'debts':'insurances',o=i<0?{}:d[key][i],h='';
if(x==='asset'){ $('mt').textContent=i<0?'Vermögen hinzufügen':'Vermögen bearbeiten';h=fld('name','Bezeichnung','text',o.name)+fld('amount','Wert (€)','number',o.amount,'step="0.01"')+'<label>Kategorie</label><select id="category">'+['Girokonto','Tagesgeld','Depot','Aktien/ETF','Fahrzeug','Sonstiges'].map(z=>`<option ${o.category===z?'selected':''}>${z}</option>`).join('')+'</select>'}
else if(x==='property'){$('mt').textContent=i<0?'Immobilie hinzufügen':'Immobilie bearbeiten';h=fld('name','Bezeichnung','text',o.name)+fld('value','Aktueller Wert (€)','number',o.value,'step="0.01"')+fld('purchase','Kaufpreis (€)','number',o.purchase,'step="0.01"')+fld('share','Eigentumsanteil (%)','number',o.share||100,'step="0.01"')+fld('loanBalance','Restschuld (€)','number',o.loanBalance,'step="0.01"')}
else if(x==='debt'){$('mt').textContent=i<0?'Kredit hinzufügen':'Kredit bearbeiten';h=fld('name','Bezeichnung','text',o.name)+fld('balance','Restschuld (€)','number',o.balance,'step="0.01"')+fld('rate','Zinssatz (%)','number',o.rate,'step="0.01"')+fld('monthly','Monatliche Rate (€)','number',o.monthly,'step="0.01"')+'<label>Kategorie</label><select id="category">'+['Immobilienkredit','Ratenkredit','Kreditkarte','Sonstiger Kredit'].map(z=>`<option ${o.category===z?'selected':''}>${z}</option>`).join('')+'</select>'}
else{$('mt').textContent=i<0?'Versicherung hinzufügen':'Versicherung bearbeiten';h=fld('name','Bezeichnung','text',o.name)+'<label>Kategorie</label><select id="category">'+['Haftpflicht','Hausrat','Kfz','Krankenversicherung','Berufsunfähigkeit','Lebensversicherung','Rechtsschutz','Wohngebäude','Sonstige'].map(z=>`<option ${o.category===z?'selected':''}>${z}</option>`).join('')+'</select>'+fld('monthly','Monatlicher Beitrag (€)','number',o.monthly,'step="0.01"')+fld('yearly','Jährlicher Beitrag (€)','number',o.yearly,'step="0.01"')+fld('end','Vertragsende','date',o.end)+fld('notice','Kündigungsfrist','text',o.notice)+fld('insured','Versicherungssumme (€)','number',o.insured,'step="0.01"')+'<label>Notizen</label><textarea id="notes">'+(o.notes||'')+'</textarea>'}
$('form').innerHTML=h;$('modal').style.display='block'}
function closeM(){$('modal').style.display='none'}
function save(){let key=t==='asset'?'assets':t==='property'?'properties':t==='debt'?'debts':'insurances',a=d[key],o;
if(t==='asset')o={name:v('name').trim(),amount:parseFloat(v('amount')),category:v('category')};
else if(t==='property')o={name:v('name').trim(),value:parseFloat(v('value')),purchase:num('purchase'),share:num('share')||100,loanBalance:num('loanBalance')};
else if(t==='debt')o={name:v('name').trim(),balance:parseFloat(v('balance')),rate:num('rate'),monthly:num('monthly'),category:v('category')};
else o={name:v('name').trim(),category:v('category'),monthly:num('monthly'),yearly:num('yearly'),end:v('end'),notice:v('notice'),insured:num('insured'),notes:v('notes')};
let req=t==='asset'?o.amount:t==='property'?o.value:t==='debt'?o.balance:null;if(!o.name||(t!=='insurance'&&isNaN(req)))return alert('Bitte die Pflichtfelder ausfüllen.');ei<0?a.push(o):a[ei]=o;localStorage.setItem(K,JSON.stringify(d));closeM();render()}
function remove(t,i){if(!confirm('Eintrag wirklich löschen?'))return;let k=t==='asset'?'assets':t==='property'?'properties':t==='debt'?'debts':'insurances';d[k].splice(i,1);localStorage.setItem(K,JSON.stringify(d));render()}
function list(id,a,type,fn){$(id).innerHTML=a.length?a.map((o,i)=>`<div class="card"><div class="item"><div><b>${o.name||''}</b><div class="muted">${o.category||''}</div></div><b class="amount">${fn(o)}</b></div><div class="actions"><button class="secondary" onclick="openM('${type}',${i})">Bearbeiten</button><button class="secondary" onclick="remove('${type}',${i})">Löschen</button></div></div>`).join(''):'<div class="card empty">Noch keine Einträge vorhanden.</div>'}
function render(){let a=d.assets.reduce((s,o)=>s+(Number(o.amount)||0),0),p=d.properties.reduce((s,o)=>s+(Number(o.value)||0)*(Number(o.share||100)/100),0),pd=d.properties.reduce((s,o)=>s+(Number(o.loanBalance)||0)*(Number(o.share||100)/100),0),de=d.debts.reduce((s,o)=>s+(Number(o.balance)||0),0),net=a+p-de;
$('net').textContent=euro(net);$('ha').textContent=euro(a+p);$('hd').textContent=euro(de);$('pe').textContent=euro(p-pd);$('liq').textContent=euro(d.assets.filter(o=>['Girokonto','Tagesgeld'].includes(o.category)).reduce((s,o)=>s+(Number(o.amount)||0),0));$('im').textContent=euro(d.insurances.reduce((s,o)=>s+(Number(o.monthly)||0),0));$('iy').textContent=euro(d.insurances.reduce((s,o)=>s+(Number(o.yearly)||0),0));
list('al',d.assets,'asset',o=>euro(o.amount));list('pl',d.properties,'property',o=>euro((Number(o.value)||0)*(Number(o.share||100)/100)));list('dl',d.debts,'debt',o=>euro(o.balance));list('il',d.insurances,'insurance',o=>euro(o.monthly));
let today=new Date().toISOString().slice(0,10);if(!d.history.length||d.history[d.history.length-1].date!==today)d.history.push({date:today,net});if(d.history.length>60)d.history.shift();localStorage.setItem(K,JSON.stringify(d));draw()}
function draw(){let h=d.history;if(h.length<2){$('chart').innerHTML='<div class="empty">Ab jetzt wird dein Nettovermögen für die Entwicklung gespeichert.</div>';return}let vals=h.map(x=>x.net),mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1,w=680,hh=150,pts=vals.map((x,i)=>`${i*(w/(vals.length-1))},${hh-10-((x-mn)/r)*(hh-20)}`).join(' ');$('chart').innerHTML=`<div class="chart"><svg viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="muted">${h[0].date} – ${h[h.length-1].date}</div>`}
render();show('dashboard');
</script></body></html>
