<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyFinance 1.4</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f3f4f6;color:#111827}.app{max-width:900px;margin:auto;padding:16px}h1{margin:0}.sub{color:#6b7280;margin-bottom:15px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px}nav button,.primary,.edit,.danger{border:0;border-radius:11px;padding:10px 13px;font-weight:700}nav button{background:#e5e7eb}nav button.active,.primary{background:#111827;color:#fff}section{display:none}.active{display:block}.hero,.card,.metric{background:#fff;border-radius:18px;padding:16px;margin-bottom:11px}.hero{background:#111827;color:#fff}.value{font-size:36px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{margin:0}.metric small{color:#6b7280}.metric strong{display:block;font-size:21px;margin-top:4px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#6b7280}.item{border-top:1px solid #e5e7eb;padding:13px 0}.item:first-child{border-top:0}.edit{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}.bar{height:9px;background:#e5e7eb;border-radius:9px;margin-top:5px}.bar span{display:block;height:100%;background:#111827}.empty{text-align:center;padding:20px;color:#6b7280}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end}.modal.show{display:flex}.modalbox{background:#fff;width:100%;padding:18px;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto}label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modalbox{max-width:700px;margin:auto;border-radius:22px}}</style><body><div class=app><h1>MyFinance</h1><div class=sub>Persönlicher Finanzüberblick · Version 1.4</div><nav id=nav></nav><section id=dashboard class=active><div id=dash></div></section><section id=assets><div id=assetView></div></section><section id=properties><div id=propertyView></div></section><section id=debts><div id=debtView></div></section><section id=insurances><div id=insuranceView></div></section></div><div id=modal class=modal><div class=modalbox><div class=row><h2 id=title></h2><button onclick=closeModal()>×</button></div><div id=form></div></div></div><script>
const K="myfinance_v14";let d=JSON.parse(localStorage.getItem(K)||'{"assets":[],"properties":[],"debts":[],"insurances":[],"history":[]}');const E=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(+n||0),N=v=>Number(String(v||"").replace(",",".")),T=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0),id=()=>Date.now()+Math.random();
function totals(){let a=T(d.assets,"amount")+T(d.properties,"value"),b=T(d.debts,"balance")+T(d.properties,"loan");return{a,b,n:a-b,l:d.assets.filter(x=>["Girokonto","Tagesgeld"].includes(x.category)).reduce((s,x)=>s+N(x.amount),0),i:d.assets.filter(x=>["Depot","Aktien/ETF"].includes(x.category)).reduce((s,x)=>s+N(x.amount),0),p:T(d.properties,"value"),pe:d.properties.reduce((s,x)=>s+N(x.value)*N(x.share||100)/100-N(x.loan)*N(x.share||100)/100,0)}}function save(){localStorage.setItem(K,JSON.stringify(d));render()}
function navs(){let x=[["dashboard","Dashboard"],["assets","Vermögen"],["properties","Immobilien"],["debts","Kredite"],["insurances","Versicherungen"]];nav.innerHTML=x.map(a=>`<button class="${a[0]=="dashboard"?"active":""}" onclick="show('${a[0]}',this)">${a[1]}</button>`).join("")}function show(x,b){document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));document.getElementById(x).classList.add("active");document.querySelectorAll("nav button").forEach(q=>q.classList.remove("active"));b.classList.add("active")}
function dashboard(){let x=totals();dash.innerHTML=`<div class=hero><div>NETTOVERMÖGEN</div><div class=value>${E(x.n)}</div><small>Vermögen minus Schulden</small></div><div class=grid><div class=metric><small>Vermögen</small><strong>${E(x.a)}</strong></div><div class=metric><small>Schulden</small><strong>${E(x.b)}</strong></div><div class=metric><small>Liquidität</small><strong>${E(x.l)}</strong></div><div class=metric><small>Immobilien-EK</small><strong>${E(x.pe)}</strong></div></div><div class=card><h2>Vermögensaufteilung</h2>${bar("Liquidität",x.l,x.a)}${bar("Depot & Investments",x.i,x.a)}${bar("Immobilien",x.p,x.a)}${bar("Sonstiges",Math.max(0,x.a-x.l-x.i-x.p),x.a)}</div><div class=card><h2>Vermögensentwicklung</h2><div class=empty>${d.history.length<2?"Mit der Zeit entsteht hier automatisch deine Vermögenskurve.":"Tageswerte wurden gespeichert."}</div></div>`}function bar(n,v,t){return`<div class=row><span>${n}</span><b>${E(v)}</b></div><div class=bar><span style="width:${t?Math.min(100,v/t*100):0}%"></span></div>`}
function list(t,title,desc,label,arr,fn){return`<div class=card><div class=row><div><h2>${title}</h2><div class=muted>${desc}</div></div><button class=primary onclick="openForm('${t}')">+ ${label}</button></div></div><div class=card>${arr.length?arr.map(fn).join(""):"<div class=empty>Noch keine Einträge vorhanden.</div>"}</div>`}
function acts(t,i){return`<div style="margin-top:8px"><button class=edit onclick="openForm('${t}','${i}')">Bearbeiten</button> <button class=danger onclick="del('${t}','${i}')">Löschen</button></div>`}
function render(){dashboard();assetView.innerHTML=list("asset","Vermögen","Konten, Depots, Fahrzeuge und sonstige Werte.","Vermögenswert",d.assets,x=>`<div class=item><div class=row><span><b>${x.name}</b><br><small class=muted>${x.category||""}</small></span><b>${E(x.amount)}</b></div>${acts("asset",x.id)}</div>`);propertyView.innerHTML=list("property","Immobilien","Wert, Eigentumsanteil und Finanzierung.","Immobilie",d.properties,x=>`<div class=item><div class=row><span><b>${x.name}</b><br><small class=muted>${x.share||100}% Eigentum</small></span><b>${E(x.value)}</b></div>${acts("property",x.id)}</div>`);debtView.innerHTML=list("debt","Kredite & Schulden","Restschuld, Zins und monatliche Rate.","Kredit",d.debts,x=>`<div class=item><div class=row><span><b>${x.name}</b><br><small class=muted>${x.interest||0}% Zins</small></span><b>${E(x.balance)}</b></div>${acts("debt",x.id)}</div>`);insuranceView.innerHTML=list("insurance","Versicherungen","Prämien und Vertragsdaten.","Versicherung",d.insurances,x=>`<div class=item><div class=row><span><b>${x.name}</b><br><small class=muted>${x.category||""}</small></span><b>${E(x.monthly)}/Monat</b></div>${acts("insurance",x.id)}</div>`)}
const cfg={asset:[["name","Bezeichnung","text",1],["category","Kategorie","select",1,["Girokonto","Tagesgeld","Depot","Aktien/ETF","Fahrzeug","Sonstiges"]],["amount","Wert (€)","number",1],["note","Notiz","textarea",0]],property:[["name","Bezeichnung","text",1],["value","Aktueller Wert (€)","number",1],["share","Eigentumsanteil (%)","number",0],["loan","Restschuld Kredit (€)","number",0],["payment","Monatliche Rate (€)","number",0]],debt:[["name","Bezeichnung","text",1],["category","Kategorie","select",0,["Ratenkredit","Kreditkarte","Privatdarlehen","Sonstiges"]],["balance","Restschuld (€)","number",1],["interest","Zinssatz (%)","number",0],["payment","Monatliche Rate (€)","number",0]],insurance:[["name","Bezeichnung","text",1],["category","Kategorie","select",0,["Haftpflicht","Hausrat","Kfz","Rechtsschutz","Berufsunfähigkeit","Leben","Krankenversicherung","Sonstiges"]],["monthly","Monatsbeitrag (€)","number",0],["yearly","Jahresbeitrag (€)","number",0],["end","Vertragsende","date",0]]};let typ,cur;
function openForm(t,i){typ=t;cur=i||null;let o=i?d[t+"s"].find(x=>x.id==i):{};title.textContent=(i?"Bearbeiten: ":"Neue ")+t;form.innerHTML='<form onsubmit="submitForm(event)"><div class=formgrid>'+cfg[t].map(f=>{let v=o[f[0]]||"";if(f[2]=="select")return`<div><label>${f[1]}</label><select name=${f[0]} ${f[3]?"required":""}><option value="">Bitte wählen</option>${f[4].map(z=>`<option ${z==v?"selected":""}>${z}</option>`).join("")}</select></div>`;return`<div><label>${f[1]}</label><input name=${f[0]} type=${f[2]} value="${v}" ${f[3]?"required":""}></div>`}).join("")+'</div><button class=primary style="width:100%;margin-top:15px>Speichern</button></form>';modal.classList.add("show")}
function submitForm(e){e.preventDefault();let f=new FormData(e.target),o={id:cur||id()};cfg[typ].forEach(x=>o[x[0]]=f.get(x[0])||"");if(!o.name)return alert("Bitte die Bezeichnung eingeben.");if(typ=="asset"&&!isFinite(N(o.amount)))return alert("Bitte den Wert eingeben.");if(typ=="property"&&!isFinite(N(o.value)))return alert("Bitte den Immobilienwert eingeben.");if(typ=="debt"&&!isFinite(N(o.balance)))return alert("Bitte die Restschuld eingeben.");let a=d[typ+"s"],j=a.findIndex(x=>x.id==o.id);j<0?a.push(o):a[j]=o;closeModal();save()}function closeModal(){modal.classList.remove("show")}function del(t,i){if(confirm("Eintrag wirklich löschen?")){d[t+"s"]=d[t+"s"].filter(x=>x.id!=i);save()}}
function migrate(){if(d.assets.length||d.properties.length||d.debts.length||d.insurances.length)return;for(let k of["myfinance_v13","myfinance_v12"]){try{let x=JSON.parse(localStorage.getItem(k));if(x){d={assets:x.assets||[],properties:x.properties||[],debts:x.debts||[],insurances:x.insurances||[],history:x.history||[]};break}}catch(e){}}}navs();migrate();render();
</script></body></html>
